<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>カート追加</title>
<link th:href="@{/css/common/header.css}" rel="stylesheet">
<link th:href="@{/css/common/footer.css}" rel="stylesheet">
<link th:href="@{/css/pages/cart_add.css}" rel="stylesheet">
</head>
<body>
	<header th:replace="~{common/header :: layout-header}"></header>
	
	<h1 class="cart-add-item__title">カート追加画面</h1>
	
	<p class="cart-add-item__message" th:if="${message}" th:text="${message}"></p>
	
	<div class="cart-add-item">
		
		<img class="cart-add-item__img" th:src="@{${cart.product.imgPath}}" alt="商品画像">
		
		<div class="cart-add-item__detail">
			<p>商品名：<span th:text="${cart.product.productName}"></span></p>
			<p>個数：<span th:text="${cart.quantity}"></span></p>
			<p>カート内の合計：<span th:text="${selectedItemPrice}"></span>円</p>
		</div>
	</div>
	
	<div class="btn-group">
		<form th:action="@{/purchase/cart/start}" method="post">
			<input type="hidden"
	         th:name="${_csrf.parameterName}"
	         th:value="${_csrf.token}">
	  		<button class="btn-purchase" type="submit">レジに進む</button>
		</form>
		<a class="btn-cart" th:href="@{/cart/list}">カートに移動</a>
		<a class="btn-top" th:href="@{/top}">TOP画面に戻る</a>
	</div>
		
	
	<footer th:replace="~{common/footer :: layout-footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<link th:href="@{/css/pages/login.css}" rel="stylesheet">
<link th:href="@{/css/common/footer.css}" rel="stylesheet">
</head>
<body>
	
	<h1>ログイン画面</h1>
	
	<div class="login-form">
		<form th:action="@{/login}" method="post">
		
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

			<div class="form-group">
				<label for="email">メールアドレス</label><br>
				<input type="email" id="email" name="username">
			</div>
			
			<div class="form-group">
				<label for="password">パスワード</label><br>
			<input type="password" id="password" name="password">
			</div>
			

			<div class="btn-area">
				<button class="login-btn">ログイン</button>
				<a class="register-btn" th:href="@{/user/register}">新規登録</a>
			</div>
		</form>
	</div>
	
	<!--ログイン失敗 -->
	<div class="error-message" th:if="${param.error}">
		メールアドレスまたはパスワードが違います
	</div>
	
	<!--ログアウト完了 -->
	<div class="logout-message" th:if="${param.logout}">
    	ログアウトしました
    </div>
	
	<footer th:replace="common/footer :: layout-footer"></footer>
</body>
</html>
